   <g id="text_1">
    <text style="fill: #1d1d1f; font: 11px 'Helvetica Neue'; text-anchor: start" x="119.13984" y="28.200312" transform="rotate(-0 119.13984 28.200312)">Study design</text>
   </g>
   <g id="text_2">
    <text style="fill: #5c5c63; font: 10px 'Helvetica Neue'; text-anchor: start" x="20.16" y="68.869977" transform="rotate(-0 20.16 68.869977)">A</text>
   </g>
   <g id="text_3">
    <text style="fill: #5c5c63; font: 7.5px 'Helvetica Neue'; text-anchor: start" x="20.16" y="80.063253" transform="rotate(-0 20.16 80.063253)">Data and splits</text>
   </g>
   <g id="text_4">
    <text style="fill: #1d1d1f; font: 9px 'Helvetica Neue'; text-anchor: start" x="227.027866" y="90.057018" transform="rotate(-0 227.027866 90.057018)">Thirty annotated clips</text>
   </g>
   <g id="text_5">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="227.027866" y="102.321388" transform="rotate(-0 227.027866 102.321388)">RealTalk. Listener nods and head shakes.</text>
   </g>
   <g id="text_6">
    <text style="fill: #2c5f8a; font: 9px 'Helvetica Neue'; text-anchor: start" x="128.048026" y="152.921298" transform="rotate(-0 128.048026 152.921298)">Development, gold 001–015</text>
   </g>
   <g id="text_7">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="128.048026" y="165.185668" transform="rotate(-0 128.048026 165.185668)">Thresholds and model selection.</text>
   </g>
   <g id="text_8">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="128.048026" y="175.730644" transform="rotate(-0 128.048026 175.730644)">Leave-one-clip-out where needed.</text>
   </g>
   <g id="text_9">
    <text style="fill: #c46a2d; font: 9px 'Helvetica Neue'; text-anchor: start" x="338.380186" y="152.921298" transform="rotate(-0 338.380186 152.921298)">Test, gold 016–030</text>
   </g>
   <g id="text_10">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="338.380186" y="165.320668" transform="rotate(-0 338.380186 165.320668)">Scored once after development</text>
   </g>
   <g id="text_11">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="338.380186" y="175.730644" transform="rotate(-0 338.380186 175.730644)">choices are frozen.</text>
   </g>
   <g id="text_12">
    <text style="fill: #5c5c63; font: 10px 'Helvetica Neue'; text-anchor: start" x="20.16" y="206.765817" transform="rotate(-0 20.16 206.765817)">B</text>
   </g>
   <g id="text_13">
    <text style="fill: #5c5c63; font: 7.5px 'Helvetica Neue'; text-anchor: start" x="20.16" y="218.085655" transform="rotate(-0 20.16 218.085655)">Shared protocol</text>
   </g>
   <g id="text_14">
    <text style="fill: #1d1d1f; font: 9px 'Helvetica Neue'; text-anchor: middle" x="317.09952" y="226.73613" transform="rotate(-0 317.09952 226.73613)">3 s windows, 2 s stride, on both splits</text>
   </g>
   <g id="text_15">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: middle" x="317.09952" y="239.0005" transform="rotate(-0 317.09952 239.0005)">15 × 29 = 435 windows per split. Nod DEV 52 positive; shake DEV 39.</text>
   </g>
   <g id="text_16">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: middle" x="317.09952" y="249.680476" transform="rotate(-0 317.09952 249.680476)">EMOCA head rotation. RGB face crops of the listener.</text>
   </g>
   <g id="text_17">
    <text style="fill: #5c5c63; font: 10px 'Helvetica Neue'; text-anchor: start" x="20.16" y="285.041985" transform="rotate(-0 20.16 285.041985)">C</text>
   </g>
   <g id="text_18">
    <text style="fill: #5c5c63; font: 7.5px 'Helvetica Neue'; text-anchor: start" x="20.16" y="296.361823" transform="rotate(-0 20.16 296.361823)">Systems</text>
   </g>
   <g id="text_19">
    <text style="fill: #2c5f8a; font: 9px 'Helvetica Neue'; text-anchor: start" x="128.048026" y="309.068058" transform="rotate(-0 128.048026 309.068058)">Pose</text>
   </g>
   <g id="text_20">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="128.048026" y="321.332428" transform="rotate(-0 128.048026 321.332428)">Amplitude and return-ratio rules.</text>
   </g>
   <g id="text_21">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="128.048026" y="332.012404" transform="rotate(-0 128.048026 332.012404)">1-D CNN; multiple-instance model.</text>
   </g>
   <g id="text_22">
    <text style="fill: #2f6b45; font: 9px 'Helvetica Neue'; text-anchor: start" x="338.380186" y="309.068058" transform="rotate(-0 338.380186 309.068058)">Video</text>
   </g>
   <g id="text_23">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="338.380186" y="321.396178" transform="rotate(-0 338.380186 321.396178)">VideoMAE on identity-fixed crops.</text>
   </g>
   <g id="text_24">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: start" x="338.380186" y="331.877404" transform="rotate(-0 338.380186 331.877404)">Development only; test not opened.</text>
   </g>
   <g id="text_25">
    <text style="fill: #5c5c63; font: 10px 'Helvetica Neue'; text-anchor: start" x="20.16" y="375.485433" transform="rotate(-0 20.16 375.485433)">D</text>
   </g>
   <g id="text_26">
    <text style="fill: #5c5c63; font: 7.5px 'Helvetica Neue'; text-anchor: start" x="20.16" y="386.678709" transform="rotate(-0 20.16 386.678709)">Evaluation</text>
   </g>
   <g id="text_27">
    <text style="fill: #1d1d1f; font: 9px 'Helvetica Neue'; text-anchor: middle" x="211.93344" y="403.972842" transform="rotate(-0 211.93344 403.972842)">Headline metric</text>
   </g>
   <g id="text_28">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: middle" x="211.93344" y="415.42606" transform="rotate(-0 211.93344 415.42606)">Balanced accuracy.</text>
   </g>
   <g id="text_29">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: middle" x="211.93344" y="425.971036" transform="rotate(-0 211.93344 425.971036)">A constant predictor scores 0.500.</text>
   </g>
   <g id="text_30">
    <text style="fill: #1d1d1f; font: 9px 'Helvetica Neue'; text-anchor: middle" x="422.2656" y="403.972842" transform="rotate(-0 422.2656 403.972842)">Uncertainty</text>
   </g>
   <g id="text_31">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: middle" x="422.2656" y="415.48981" transform="rotate(-0 422.2656 415.48981)">95% intervals resample 15 clips.</text>
   </g>
   <g id="text_32">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: middle" x="422.2656" y="425.971036" transform="rotate(-0 422.2656 425.971036)">An interval containing 0.500 is</text>
   </g>
   <g id="text_33">
    <text style="fill: #5c5c63; font: 8px 'Helvetica Neue'; text-anchor: middle" x="422.2656" y="436.579762" transform="rotate(-0 422.2656 436.579762)">not distinguished from chance.</text>
   </g>
  </g>
